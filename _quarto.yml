project:
  type: website
  output-dir: _book

website:
  title: "Introduction to Machine Learning"
  page-navigation: true

  # "Report an issue" link (with GitHub icon) under each page's table of contents.
  repo-url: https://github.com/BredaUniversityADSAI/ml-book
  repo-actions: [issue]

  # The sidebar defines both the visual hierarchy and the previous/next order.
  # Self-study is nested Self-study -> Theme -> Activity, which a book's
  # `chapters`/`part` cannot express (it allows only one level of parts).
  sidebar:
    style: floating
    collapse-level: 1
    # Icons under the sidebar title. The dark-mode toggle is added next to
    # them automatically because a dark theme is configured below.
    tools:
      - icon: github
        href: https://github.com/BredaUniversityADSAI/ml-book
        aria-label: GitHub repository

    contents:
    - index.qmd

    # Self-study: order is pedagogical (not by filename).
    # `text` sets the sidebar label; the page keeps its own heading.
    - section: "Self-study"
      contents:
        - section: "1. Foundations of Machine Learning"
          contents:
            - href: self-study/01_machine_learning_landscape.qmd
              text: "The Machine Learning Landscape"
            - href: self-study/001_getting_started.ipynb
              text: "Getting Started"
            - href: self-study/002_classification.ipynb
              text: "Classification"
            - href: self-study/003_regression.ipynb
              text: "Regression"
            - href: self-study/004_unsupervised_learning.ipynb
              text: "Unsupervised Learning"

        - section: "2. The End-to-End ML Workflow"
          contents:
            - href: self-study/02_end_to_end_machine_learning.qmd
              text: "End-to-End Machine Learning Project"
            - href: self-study/005_data_prep.ipynb
              text: "Data Preparation"
            - href: self-study/006_data_understanding.ipynb
              text: "Data Understanding"
            - href: self-study/007_modeling_and_evaluation.ipynb
              text: "Modeling & Evaluation"

        - section: "3. Supervised & Unsupervised Learning"
          contents:
            - href: self-study/03_classification.qmd
              text: "Classification"
            - href: self-study/04_regression.qmd
              text: "Regression"
            - href: self-study/05_unsupervised_learning.qmd
              text: "Unsupervised Learning"

        - section: "4. Advanced Scikit-Learn"
          contents:
            - href: self-study/008_advanced_scikitlearn.ipynb
              text: "Pipelines & ColumnTransformer"

        - section: "5. Tree-Based Algorithms"
          contents:
            - href: self-study/009_decision_trees.ipynb
              text: "Decision Trees"
            - href: self-study/06_decision_trees.qmd
              text: "Decision Trees — Reading"
            - href: self-study/010_random_forests.ipynb
              text: "Random Forests"
            - href: self-study/07_ensemble_learning_random_forests.qmd
              text: "Ensemble Learning & Random Forests"
            - href: self-study/011_gradient_boosting.ipynb
              text: "Gradient Boosting"
            - href: self-study/08_gradient_boosting_stacking.qmd
              text: "Gradient Boosting & Stacking"

        - section: "6. Applied ML Research"
          contents:
            - href: self-study/09_communicating_technical_work.qmd
              text: "Communicating Technical Work"
            - href: self-study/10_understanding_ml_research.qmd
              text: "Understanding ML Research"
            - href: self-study/11_from_research_to_practice.qmd
              text: "Research to Practice"

    # Overall DataLab overview page
    - datalab/index.qmd

    # Iteration
    - section: datalab/iteration-1/index.qmd
      contents:
        - datalab/iteration-1/task1_business_understanding.qmd
        - datalab/iteration-1/task1_data_understanding.qmd
        - datalab/iteration-1/i1_t1_nb1_classification.ipynb
        - datalab/iteration-1/i1_t1_nb2_regression.ipynb
        - datalab/iteration-1/i1_t1_nb3_clustering.ipynb

    # Iteration 2
    - section: datalab/iteration-2/index.qmd
      contents:
        - datalab/iteration-2/i2_t3_nb1_understanding_hopv_stability_csv.ipynb
        - datalab/iteration-2/i2_t3_nb2_understanding_hopv_homolumo_data.ipynb
        - datalab/iteration-2/i2_t4_nb1_data_prep.ipynb
        - datalab/iteration-2/i2_t5_nb1_classification.ipynb
        - datalab/iteration-2/i2_t6_nb1_regression.ipynb
        - datalab/iteration-2/i2_t7_nb1_clustering.ipynb
  
    # Iteration 3
    - datalab/iteration-3/index.qmd


format:
  html:
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    filters:
      - filters/colab-button.lua
    toc: true
    number-sections: false